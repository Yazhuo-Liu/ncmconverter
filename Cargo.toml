[workspace]
members  = ["crates/*"]
resolver = "2"

    [workspace.package]
    authors    = ["Yazhuo Liu"]
    edition    = "2021"
    homepage   = "https://yazhuoliu.com/ncmconverter/"
    license    = "MIT"
    readme     = "README.md"
    repository = "https://github.com/Yazhuo-Liu/ncmconverter"
    version    = "0.2.11"

    [workspace.dependencies]
    ncm_core = { version = "0.2.11", path = "crates/ncm_core" }
    ncm_meta = { version = "0.2.11", path = "crates/ncm_meta" }

    aes                = "0.8.4"
    anyhow             = "1.0.89"
    base64             = "0.22.1"
    bpaf               = "0.9"
    ecb                = "0.1.2"
    id3                = "1.14.0"
    js-sys             = "0.3.70"
    metaflac           = "0.2.7"
    miniserde          = "0.1"
    sha2               = "0.10"
    testing            = "0.42.0"
    wasm-bindgen       = "0.2.93"

[profile.release]
lto   = true
panic = "abort"
strip = "debuginfo"
